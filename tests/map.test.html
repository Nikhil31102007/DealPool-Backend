<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DealPool Map Test</title>
  <style>
    html,body { height:100%; margin:0; padding:0; }
    #controls {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1000;
      background: white;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      font-family: sans-serif;
      font-size: 13px;
    }
    #controls input { width: 220px; margin-right: 6px; }
    #map { height:100%; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
</head>
<body>
  <div id="controls">
    API Base: <input id="apiBase" value="http://localhost:3000">
    <button id="reload">Reload Deals</button>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([37.7749, -122.4194], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
    }).addTo(map);

    let markers = [];

    function apiUrl(path) {
      const base = document.getElementById('apiBase').value.replace(/\/$/, "");
      return `${base}${path}`;
    }

    async function loadDeals() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      try {
        const res = await fetch(apiUrl('/api/deals'), { credentials: 'include' });
        const json = await res.json();

        if (!json.success) {
          console.error('API error:', json.error);
          return;
        }

        (json.data || []).forEach(d => {
          const coords = d.location?.coordinates || [d.lng, d.lat];
          const lat = coords[1] ?? d.lat ?? 0;
          const lng = coords[0] ?? d.lng ?? 0;
          const marker = L.marker([lat, lng]).addTo(map).bindPopup(d.title || 'Deal');
          markers.push(marker);
        });
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById('reload').addEventListener('click', loadDeals);

    loadDeals();
  </script>
</body>
</html>
