<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DealPool Map Test</title>
  <style>
    html,body { height:100%; margin:0; padding:0; }
    #controls {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1000;
      background: white;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      font-family: sans-serif;
      font-size: 13px;
    }
    #controls input { width: 220px; margin-right: 6px; }
    #controls button { margin-top: 6px; }
    #map { height:100%; }
    #gpsStatus {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(0,0,0,0.7);
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 4px;
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
</head>
<body>
  <div id="controls">
    API Base: <input id="apiBase" value="http://localhost:3000"><br>
    <button id="reload">Reload Deals</button>
    <button id="toggleGps">📍 Start Live GPS</button>
  </div>
  <div id="map"></div>
  <div id="gpsStatus">GPS: off</div>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([37.7749, -122.4194], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
    }).addTo(map);

    let markers = [];

    function apiUrl(path) {
      const base = document.getElementById('apiBase').value.replace(/\/$/, "");
      return `${base}${path}`;
    }

    async function loadDeals() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      try {
        // Server now paginates: { success, data: { items: [...], pagination: {...} } }
        // limit=100 pulls the max single page; for a full "load everything" view
        // this would need to loop using pagination.hasMore, but for the map test
        // page one page is enough to visually confirm markers render.
        const res = await fetch(apiUrl('/api/deals?limit=100'), { credentials: 'include' });
        const json = await res.json();

        if (!json.success) {
          console.error('API error:', json.error);
          return;
        }

        const deals = json.data?.items || [];

        deals.forEach(d => {
          const coords = d.location?.coordinates || [d.lng, d.lat];
          const lat = coords[1] ?? d.lat ?? 0;
          const lng = coords[0] ?? d.lng ?? 0;
          const marker = L.marker([lat, lng]).addTo(map).bindPopup(d.title || 'Deal');
          markers.push(marker);
        });

        if (json.data?.pagination?.hasMore) {
          console.warn(`Showing ${deals.length} of ${json.data.pagination.total} deals — more exist beyond this page.`);
        }
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById('reload').addEventListener('click', loadDeals);

    loadDeals();

    // ---- Live GPS tracking ----
    let gpsWatchId = null;
    let gpsMarker = null;
    let gpsAccuracyCircle = null;
    const gpsStatus = document.getElementById('gpsStatus');
    const toggleGpsBtn = document.getElementById('toggleGps');

    function startLiveGps() {
      if (!navigator.geolocation) {
        alert('Geolocation is not supported by this browser.');
        return;
      }

      gpsStatus.textContent = 'GPS: requesting permission...';

      gpsWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, accuracy } = pos.coords;

          gpsStatus.textContent = `GPS: ${latitude.toFixed(5)}, ${longitude.toFixed(5)} (±${Math.round(accuracy)}m)`;

          if (!gpsMarker) {
            gpsMarker = L.circleMarker([latitude, longitude], {
              radius: 8,
              color: '#fff',
              weight: 2,
              fillColor: '#2563eb',
              fillOpacity: 1,
            }).addTo(map).bindPopup('You are here');

            gpsAccuracyCircle = L.circle([latitude, longitude], {
              radius: accuracy,
              color: '#2563eb',
              fillColor: '#2563eb',
              fillOpacity: 0.1,
              weight: 1,
            }).addTo(map);

            map.setView([latitude, longitude], 15);
          } else {
            gpsMarker.setLatLng([latitude, longitude]);
            gpsAccuracyCircle.setLatLng([latitude, longitude]);
            gpsAccuracyCircle.setRadius(accuracy);
          }
        },
        (err) => {
          console.error('GPS error:', err);
          gpsStatus.textContent = `GPS: error — ${err.message}`;
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 15000,
        }
      );

      toggleGpsBtn.textContent = '🛑 Stop Live GPS';
    }

    function stopLiveGps() {
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
      }

      if (gpsMarker) {
        map.removeLayer(gpsMarker);
        gpsMarker = null;
      }

      if (gpsAccuracyCircle) {
        map.removeLayer(gpsAccuracyCircle);
        gpsAccuracyCircle = null;
      }

      gpsStatus.textContent = 'GPS: off';
      toggleGpsBtn.textContent = '📍 Start Live GPS';
    }

    toggleGpsBtn.addEventListener('click', () => {
      if (gpsWatchId === null) {
        startLiveGps();
      } else {
        stopLiveGps();
      }
    });
  </script>
</body>
</html>
